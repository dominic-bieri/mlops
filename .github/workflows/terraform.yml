name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.16.5"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  apply:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # applies one at a time
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    # Google roles are bound to this environment, not the whole repo
    environment: terraform
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_model_region: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.GCP_TFSTATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # before auth, so the credentials file doesn't exist yet
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
