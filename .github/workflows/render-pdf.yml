name: Render Typst PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5

      - name: Compile *.typ files
        run: |
          find docs -type f -name '*.typ' -print0 | while IFS= read -r -d '' file; do
            typst compile "$file" "${file%.typ}.pdf"
          done

      - name: Open PR with rendered PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.pdf
          git diff --staged --quiet && exit 0

          branch="render-pdf/auto-${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m ":robot: render PDFs from Typst sources"
          git push -u origin "$branch"

          gh pr create \
            --title ":robot: render PDFs from Typst sources" \
            --body "Automated PDF render triggered by changes under \`docs/\`." \
            --base "${{ github.ref_name }}" \
            --head "$branch"
