name: Render Typst PDF

on:
  push:
    branches: [main]
    # sources only, not the rendered PDF, else merging the bot PR renders again
    paths:
      - "docs/**/*.typ"
      - "docs/media/**"

concurrency:
  group: render-pdf
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - uses: typst-community/setup-typst@v5.3.0

      - name: Compile *.typ files
        run: |
          # fixed PDF date, so the same source gives the same PDF
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          find docs -type f -name '*.typ' -print0 | while IFS= read -r -d '' file; do
            typst compile "$file" "${file%.typ}.pdf"
          done

      - name: Open PR with rendered PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # token only in this step, not in .git/config
          gh auth setup-git
          git add docs/*.pdf
          git diff --staged --quiet && exit 0

          branch="render-pdf/auto"
          git checkout -b "$branch"
          git commit -m ":robot: render PDFs from Typst sources"
          git push --force origin "$branch"

          open_prs=$(gh pr list --head "$branch" --state open --json number --jq length)
          [ "$open_prs" -gt 0 ] && exit 0

          gh pr create \
            --title ":robot: render PDFs from Typst sources" \
            --body "Automated PDF render triggered by changes under \`docs/\`." \
            --base "${{ github.ref_name }}" \
            --head "$branch"
