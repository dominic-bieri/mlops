name: Render Typst PDF

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/render-pdf.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5

      - name: Compile *.typ files
        run: |
          find docs -type f -name '*.typ' -print0 | while IFS= read -r -d '' file; do
            typst compile "$file" "${file%.typ}.pdf"
          done

      - name: Commit rendered PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.pdf
          git diff --staged --quiet || git commit -m ":robot: render PDFs from Typst sources"
          git push
