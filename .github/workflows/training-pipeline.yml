name: Training pipeline

on:
  # started by cron-job.org on the 1st, 12:00 New York time (ADR 5, 6)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: training-pipeline
    # Google roles are bound to this environment, see docs/google-cloud.md
    environment: training-pipeline
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      BQ_DATASET: sp500_vol
      IMAGE: ghcr.io/${{ github.repository_owner }}/sp500-vol-training:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Pull image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Train and register
        run: >-
          docker run --rm
          -e GCP_PROJECT_ID -e GCP_REGION -e BQ_DATASET
          -e GITHUB_ACTIONS -e GITHUB_SHA
          -v "$GOOGLE_APPLICATION_CREDENTIALS:/creds/adc.json:ro"
          -e GOOGLE_APPLICATION_CREDENTIALS=/creds/adc.json
          "$IMAGE"
