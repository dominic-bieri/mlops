name: Feature pipeline

on:
  # started by cron-job.org Tue–Sat 10:00 New York time, GitHub's schedule runs hours late (ADR 5)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # one run at a time, so two runs never write to BigQuery together
    concurrency:
      group: feature-pipeline
      cancel-in-progress: false
    # Google roles are bound to this environment, see docs/google-cloud.md
    environment: feature-pipeline
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BQ_DATASET: sp500_vol
      IMAGE: ghcr.io/${{ github.repository_owner }}/sp500-vol-features:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Pull image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Ingest VIX and SPY, build features
        run: >-
          docker run --rm
          -e FRED_API_KEY -e TIINGO_API_KEY -e GCP_PROJECT_ID -e BQ_DATASET
          -e GITHUB_ACTIONS -e GITHUB_SHA
          -v "$GOOGLE_APPLICATION_CREDENTIALS:/creds/adc.json:ro"
          -e GOOGLE_APPLICATION_CREDENTIALS=/creds/adc.json
          "$IMAGE"
