name: Feature pipeline

on:
  # morning after each US trading day, after FRED publishes the VIX (shortly after 9:30 New York time)
  schedule:
    # off the hour, GitHub delays or drops runs at :00 under load
    # https://github.com/orgs/community/discussions/147369
    - cron: "17 10 * * 2-6"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # one run at a time, both write to BigQuery
    concurrency:
      group: feature-pipeline
      cancel-in-progress: false
    # Google roles are bound to this environment, see docs/google-cloud.md
    environment: feature-pipeline
    permissions:
      contents: read
      id-token: write
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BQ_DATASET: sp500_vol
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # before auth, so the credentials file doesn't exist yet
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Ingest VIX and SPY
        run: uv run --no-sync python -m sp500_vol.features.ingest

      - name: Build features
        run: uv run --no-sync python -m sp500_vol.features.build
