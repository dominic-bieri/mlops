[project]
name = "sp500-vol"
version = "0.1.0"
description = "S&P 500 realized volatility forecast — MLOps HS26"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34",
    "pandas>=3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp500_vol"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
