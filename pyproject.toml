[project]
name = "sp500-vol"
version = "0.1.0"
description = "S&P 500 realized volatility forecast, MLOps HS26"
requires-python = ">=3.14"
dependencies = [
    "requests==2.34.2",
    "pandas==3.1.0",
    "python-dotenv==1.2.4",
    "google-cloud-bigquery[pandas]==3.46.2",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "google-cloud-aiplatform==2.7.0",
    "google-cloud-storage==3.17.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp500_vol"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
